name: SonarQube + Trivy CI

on:
  push:
    branches:
      - main

jobs:
  sonar-trivy:
    name: SonarQube Scan and Trivy Scan
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Install Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install wget -y
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.50.2_Linux-64bit.deb
          sudo dpkg -i trivy_0.50.2_Linux-64bit.deb

      # Run Trivy scan
      - name: Run Trivy vulnerability scan on source code
        run: |
          trivy fs . > trivy-report.txt || true

      # Upload Trivy report as artifact
      - name: Upload Trivy scan report
        uses: actions/upload-artifact@v3
        with:
          name: trivy-report
          path: trivy-report.txt

      # Run SonarQube Scan
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: sqa_27175b5ee8cb12d3cbc5a277cb5156fddaebd7e4
          SONAR_HOST_URL: http://20.169.234.158:9000/


      # Optional: Fail the build if Sonar Quality Gate fails
      # - name: Check SonarQube Quality Gate
      #   uses: sonarsource/sonarqube-quality-gate-action@master
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
