name: SonarQube + Trivy Scan

on:
  push:
    branches:
      - main

jobs:
  scan:
    name: SonarQube and Trivy Scan
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Install SonarQube Scanner (optional, handled by action)
      # Run SonarQube Scan
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://20.169.234.158:9000/

      # Optional: Fail if Quality Gate fails
      # - name: SonarQube Quality Gate
      #   uses: sonarsource/sonarqube-quality-gate-action@master
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Install Trivy (latest version)
      - name: Install Trivy
        run: |
          TRIVY_VERSION=$(curl -s https://api.github.com/repos/aquasecurity/trivy/releases/latest | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -sfL https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb -o trivy.deb
          sudo dpkg -i trivy.deb

      # Scan source code with Trivy
      - name: Trivy Scan - Filesystem
        run: |
          trivy fs --exit-code 0 --severity HIGH,CRITICAL .

      # Optional: Scan Docker image with Trivy (uncomment if needed)
      # - name: Build Docker Image
      #   run: docker build -t myapp:latest .

      # - name: Trivy Scan - Docker Image
      #   run: trivy image --exit-code 1 --severity HIGH,CRITICAL myapp:latest
